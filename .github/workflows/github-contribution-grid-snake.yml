name: Generate GitHub contribution snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: kyvu09
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake.gif

      - name: Publish to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git checkout output
          else
            git checkout --orphan output
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p output
          cp -f dist/github-contribution-grid-snake.svg output/github-contribution-grid-snake.svg
          cp -f dist/github-contribution-grid-snake.gif output/github-contribution-grid-snake.gif

          git add output
          git diff --cached --quiet || git commit -m "Update GitHub contribution snake"
          git push origin output --force
